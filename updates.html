<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <title>NOCTIDE 更新记录</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="./assets/noc/fonts/noc-serif-400.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="./assets/noc/fonts/noc-serif-700.woff2">
    <style>
      @font-face {
        font-family: "NocSerif";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local("Songti SC Regular"), url(./assets/noc/fonts/noc-serif-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "NocSerif";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: local("Songti SC Bold"), url(./assets/noc/fonts/noc-serif-700.woff2) format("woff2");
      }
      :root { --reading-bg: #1d1c1c; }
      html { background: var(--reading-bg); }
      body {
        margin: 0;
        background: var(--reading-bg);
        font-family: "NocSerif", "Songti SC", "SimSun", "STSong", "Noto Serif CJK SC", "Arial Unicode MS", serif;
        color: #b3b3b3;
      }
      .updates {
        width: min(100%, 960px);
        margin: 0 auto;
        padding: 48px 16px 64px;
        display: grid;
        justify-items: center;
        gap: 4px;
        text-align: center;
      }
      .updates h1 {
        margin: 0 0 20px;
        font-size: 1.05rem;
        font-weight: 400;
        color: #b3b3b3;
      }
      .updates p { margin: 0; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main class="updates">
      <h1>更新记录 · 共 3 次</h1>
      <p>2026-10-08 · 增加了更新记录页面</p>
      <p>2026-10-07 · PPT更新</p>
      <p>2026-10-06 · 页面搭建</p>
    </main>
  </body>
</html>
