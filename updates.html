<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <title>NOCTIDE 更新记录</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="./assets/noc/fonts/noc-serif-400.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="./assets/noc/fonts/noc-serif-700.woff2">
    <style>
      @font-face {
        font-family: "NocSerif";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local("Songti SC Regular"), url(./assets/noc/fonts/noc-serif-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "NocSerif";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: local("Songti SC Bold"), url(./assets/noc/fonts/noc-serif-700.woff2) format("woff2");
      }
      :root { --reading-bg: #1d1c1c; }
      html { background: var(--reading-bg); }
      body {
        margin: 0;
        background: var(--reading-bg);
        font-family: "NocSerif", "Songti SC", "SimSun", "STSong", "Noto Serif CJK SC", "Arial Unicode MS", serif;
        color: #b3b3b3;
      }
      .updates {
        width: min(100%, 960px);
        margin: 0 auto;
        padding: 48px 16px 64px;
        text-align: center;
      }
      .updates h1 {
        margin: 0 0 20px;
        font-size: 1.05rem;
        font-weight: 400;
        color: #b3b3b3;
      }
      .upd { width: 100%; max-width: 32em; margin: 6px auto 0; }
      .upd summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        font-size: 0.9rem;
        color: #b3b3b3;
      }
      .upd summary::-webkit-details-marker { display: none; }
      .upd .chev {
        width: 6px;
        height: 6px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg);
        transition: transform 0.2s ease;
      }
      .upd[open] .chev { transform: rotate(-135deg); }
      .upd .note {
        margin: 8px 0 0;
        padding: 12px 14px;
        text-align: left;
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--reading-bg);
        background: #d6d6d6;
      }
    </style>
  </head>
  <body>
    <main class="updates">
      <h1>更新记录 · 共 4 次</h1>
      <details class="upd">
        <summary>2026-10-11<span class="chev" aria-hidden="true"></span></summary>
        <p class="note">更新并实现了第P09的功能，目前可游玩时长在25min左右。</p>
      </details>
      <details class="upd">
        <summary>2026-10-08<span class="chev" aria-hidden="true"></span></summary>
        <p class="note">增加了更新记录页面，也就是你看到的这个页面。</p>
      </details>
      <details class="upd">
        <summary>2026-10-07<span class="chev" aria-hidden="true"></span></summary>
        <p class="note">是的没错，网页的内容排版是我用PPT做的。</p>
      </details>
      <details class="upd">
        <summary>2026-10-06<span class="chev" aria-hidden="true"></span></summary>
        <p class="note">页面搭建</p>
      </details>
    </main>
  </body>
</html>
