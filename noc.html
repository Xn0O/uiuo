<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>NOCTIDE</title>
    
    <style>
      :root {
        
        --reading-width: 960px;
        --ph-blur: 12px;
        
        --reading-bg: #1d1c1c;
        /* 页间隔：留出底色 */
        --page-gap: 32px;
      }

      html {
        background: var(--reading-bg);
      }

      body {
        margin: 0;
        background: var(--reading-bg);
        color: #eee;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .reading {
        width: min(100%, var(--reading-width));
        margin: 0 auto;
        /* 每页各自成块，之间隔出底色 */
        display: flex;
        flex-direction: column;
        gap: var(--page-gap);
      }

      /* 每页：占位层铺满这一页的框，原图流式刷出来的部分盖在它上面。
         底色跟着封面走 */
      .page {
        position: relative;
        margin: 0;
        aspect-ratio: 16 / 9;
        background: var(--reading-bg);
        overflow: hidden;
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: var(--ph, none);
        background-position: center;
        background-size: cover;
        filter: blur(var(--ph-blur));
        transition: opacity 320ms ease;
      }

      .page.is-ready::before {
        opacity: 0;
      }

      .page img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: auto;
        
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
      }

      .tip {
        width: min(100%, var(--reading-width));
        padding: 24px 16px;
        text-align: center;
        font-size: 0.9rem;
        line-height: 1.7;
        color: #9a9a9a;
        white-space: pre-line;
      }

      
      @media print {
        html,
        body {
          background: #fff;
        }
        /* 打印时还是拼回一整张，不留缝 */
        .reading {
          gap: 0;
        }
        .tip {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="reading" id="reading"></main>

    <script src="./js/noc.js?v=3"></script>
  </body>
</html>
