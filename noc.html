        <svg viewBox="0 0 960 540" role="img" aria-label="第 6 页"><defs><pattern id="dg6" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e7e6e6"/><circle cx="1.5" cy="1.5" r="0.7" fill="#d8dbf2"/></pattern></defs><rect width="960" height="540" fill="url(#dg6)"/><rect x="166.2" y="26.05" width="239.9" height="55.65" fill="#1d1c1c"/><rect x="823.6" y="0" width="136.4" height="540.05" fill="#1d1c1c"/><rect x="-0.9" y="-0.05" width="136.4" height="540.05" fill="#1d1c1c"/><image x="663.05" y="421.4" width="136.45" height="96.5" href="./assets/noc/sprites/sp-aa0541245d.webp" transform="translate(731.27 469.65) scale(-1 1) translate(-731.27 -469.65)"/><image x="166.2" y="435.7" width="99.15" height="99.15" href="./assets/noc/sprites/sp-0b42e7d402.webp" transform="translate(215.77 485.27) scale(-1 1) translate(-215.77 -485.27)"/><path d="M0 0 L78.42 0 L97.05 18.62 L78.42 37.25 L0 37.25 L18.62 18.62 Z" fill="#1d1c1c" transform="translate(760 502.75) translate(48.52 18.62) scale(-1 1) translate(-48.52 -18.62)"/></svg>
        <div class="tx" style="left:18.06%;top:5.49%;width:23.49%;height:8.97%"><p style="text-align:left;line-height:1.2"><span style="font-size:4.17cqw;font-weight:700;color:#ffffff">✦ 游戏介绍</span></p></div><div class="tx" style="left:18.06%;top:17.81%;width:66.27%;height:48.46%"><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">这个世界的月亮发生了奇怪的变化，也因此影响了一个名</span><br><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">为猫帽岛的地方，在这里流传着海在夜晚吃人的传闻。有</span><br><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">一天，岛上开始在夜里出现各种各样的幽灵与幽灵建筑，</span><br><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">你将扮演一名蓝发女孩和幽灵鱼以及你的朋友妮约一同探</span><br><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">索调查幽灵们以及海的真相。</span></p><p style="text-align:left;line-height:1.2">​</p><p style="text-align:left;line-height:1.2">​</p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">本游戏受ghostpia、undertale、deltarune、yumenikki等游戏</span><br><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">的影响，所以你也许能看到这些游戏的影子。</span></p></div><div class="tx" style="left:71.35%;top:83.62%;width:11.52%;height:4.04%"><p style="text-align:left;line-height:1.2"><span style="color:#ffffff">是的，没错！</span></p></div><div class="tx" style="left:29.86%;top:87.86%;width:33.23%;height:5.38%"><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;color:#1d1c1c">我被遗忘了吗....</span></p></div><div class="tx" style="left:79.92%;top:93.77%;width:8.14%;height:5.38%"><p style="text-align:center;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#ffffff">05</span></p></div>

      <figure class="page" id="page-7">

        <div class="tx" style="left:18.06%;top:5.11%;width:66.27%;height:70.01%"><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">游戏设有战斗系统。当你血量降至0时，你不会真的死亡。</span></p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">当然，这是一句废话。</span></p><p style="text-align:left;line-height:1.2">​</p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">在这个游戏，你可以切换不同的道具触发不同的交互功能。</span></p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">当然，这也是一句废话。</span></p><p style="text-align:left;line-height:1.2">​</p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">*不，这并不是废话！</span></p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">我们的游戏是有存档系统的，而存档功能是由道具触发的，</span><br><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">这听上去就很重要！</span></p><p style="text-align:left;line-height:1.2">​</p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">当你获得【红顶小屋】道具后：</span></p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;font-style:italic;color:#1d1c1c">1.</span><span style="font-size:2.5cqw;color:#ffffff;background:#000000">*轻按[R键]*</span><span style="font-size:2.5cqw;font-weight:700;color:#ffffff;background:#000000">    </span><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">切换至屋顶状态后</span></p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">2.</span><span style="font-size:2.5cqw;color:#ffffff;background:#000000">*用力按下[F键]*</span><span style="font-size:2.5cqw;font-weight:700;color:#1d1c1c">即可弹出存档界面</span></p></div><div class="tx" style="left:18.06%;top:80.71%;width:30.45%;height:12.67%"><p style="text-align:left;line-height:1.2"><span style="font-weight:700;color:#000000">轻轻按和用力按效果其实是一样的。</span></p><p style="text-align:left;line-height:1.2"><span style="font-weight:700;color:#000000">最重要的是，房子可以把记忆保存起</span><br><span style="font-weight:700;color:#000000">来，也就是存档。</span></p></div><div class="tx" style="left:79.92%;top:93.77%;width:8.14%;height:5.38%"><p style="text-align:center;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#ffffff">06</span></p></div>
      </figure>

        <svg viewBox="0 0 960 540" role="img" aria-label="第 8 页"><defs><pattern id="dg8" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e7e6e6"/><circle cx="1.5" cy="1.5" r="0.7" fill="#d8dbf2"/></pattern></defs><rect width="960" height="540" fill="url(#dg8)"/><rect x="166.2" y="26.05" width="274.1" height="55.65" fill="#1d1c1c"/><rect x="823.6" y="0" width="136.4" height="540.05" fill="#1d1c1c"/><rect x="-0.9" y="-0.05" width="136.4" height="540.05" fill="#1d1c1c"/><path d="M0 0 L78.42 0 L97.05 18.62 L78.42 37.25 L0 37.25 L18.62 18.62 Z" fill="#1d1c1c" transform="translate(760 502.75) translate(48.52 18.62) scale(-1 1) translate(-48.52 -18.62)"/><image x="255.7" y="275.05" width="448.65" height="251.7" href="./assets/noc/sprites/sp-b4fa62693a.webp"/><image x="165.65" y="326.65" width="192" height="154.5" href="./assets/noc/sprites/sp-bd17f0d82b.webp"/><rect x="165.65" y="326.65" width="192" height="154.5" fill="none" stroke="#ffffff" stroke-width="5.25"/></svg>
        <div class="tx" style="left:18.06%;top:5.49%;width:27.05%;height:8.97%"><p style="text-align:left;line-height:1.2"><span style="font-size:4.17cqw;font-weight:700;color:#ffffff">✦ 战斗与玩法</span></p></div><div class="tx" style="left:79.92%;top:93.77%;width:8.14%;height:5.38%"><p style="text-align:center;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#ffffff">07</span></p></div><div class="tx" style="left:18.01%;top:18.23%;width:66.1%;height:31.09%"><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700">本游戏采用回合制战斗系统，在我方回合，提供以下3种</span><br><span style="font-size:2.5cqw;font-weight:700">操作：互动、背包、逃跑。</span></p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700">对于不同的敌人我们可以通过采取不同的互动结束战斗，</span><br><span style="font-size:2.5cqw;font-weight:700">本游戏设想的战斗系统是没有攻击这个选项，而是需要玩</span><br><span style="font-size:2.5cqw;font-weight:700">家通过不同的</span><span style="font-size:2.5cqw;font-weight:700;color:#ffffff;background:#000000">行动顺序</span><span style="font-size:2.5cqw;font-weight:700">来结束战斗/让对方放弃。</span></p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700">目前的战斗系统只能算是雏形，并不完整。</span></p></div>
      </figure>
      <figure class="page" id="page-9">
        <svg viewBox="0 0 960 540" role="img" aria-label="第 9 页"><defs><pattern id="dg9" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e7e6e6"/><circle cx="1.5" cy="1.5" r="0.7" fill="#d8dbf2"/></pattern></defs><rect width="960" height="540" fill="url(#dg9)"/><rect x="823.6" y="0" width="136.4" height="540.05" fill="#1d1c1c"/><rect x="-0.9" y="-0.05" width="136.4" height="540.05" fill="#1d1c1c"/><path d="M0 0 L78.42 0 L97.05 18.62 L78.42 37.25 L0 37.25 L18.62 18.62 Z" fill="#1d1c1c" transform="translate(760 502.75) translate(48.52 18.62) scale(-1 1) translate(-48.52 -18.62)"/><image x="256.35" y="239.4" width="478.35" height="270.05" href="./assets/noc/sprites/sp-5368659b7d.webp"/><rect x="380.8" y="255.35" width="140.7" height="46.15" fill="#e7e6e6" fill-opacity="0.53" stroke="#e54c5e" stroke-width="3"/><rect x="561.4" y="239.4" width="173.3" height="116.25" fill="#000000"/><image x="166.75" y="275.1" width="187.5" height="183" href="./assets/noc/sprites/sp-5f71158834.webp"/><rect x="166.75" y="275.1" width="187.5" height="183" fill="none" stroke="#ffffff" stroke-width="5"/></svg>
        <div class="tx" style="left:79.92%;top:93.77%;width:8.14%;height:5.38%"><p style="text-align:center;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700;color:#ffffff">08</span></p></div><div class="tx" style="left:18.01%;top:5.4%;width:66.1%;height:38.27%"><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700">道具可以改变玩家的形态，而不同道具的功能也不同。按</span><br><span style="font-size:2.5cqw;font-weight:700">下[R]即可切换不同的道具形态，比如幽灵形态按下交互键</span><br><span style="font-size:2.5cqw;font-weight:700">[F]即可吹出泡泡。</span></p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700">关于道具的管理，为了方便切换，有一定数量的道具装备</span><br><span style="font-size:2.5cqw;font-weight:700">槽位，即背包栏的前几个槽位是可供玩家切换的，若要更</span><br><span style="font-size:2.5cqw;font-weight:700">换道具，可以将想要更换的道具图标拖拽至道具装备槽。</span></p><p style="text-align:left;line-height:1.2"><span style="font-size:2.5cqw;font-weight:700">目前只有基础功能，还没做完。</span></p><p style="text-align:left;line-height:1.2">​</p></div><div class="tx" style="left:59.23%;top:45%;width:16.55%;height:20.19%"><p style="text-align:left;line-height:1.2"><span style="font-weight:700;color:#ffffff">例如，这三个槽位</span><br><span style="font-weight:700;color:#ffffff">摆放玩家需要用到</span><br><span style="font-weight:700;color:#ffffff">的道具，玩家按下R</span><br><span style="font-weight:700;color:#ffffff">键所来回切换的道</span><br><span style="font-weight:700;color:#ffffff">具就是这三个槽位。</span></p></div>
      </figure>
